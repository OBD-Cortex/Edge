# ==========================================================================
# fail2ban-ssh.conf -- SSH Jail Configuration for OBD-Cortex Edge Node
# ==========================================================================
#
# [*] Purpose:
#     Protects the Raspberry Pi 4 SSH service against brute-force login
#     attacks by temporarily banning source IPs that exhibit repeated
#     authentication failures.
#
# [*] Deployment:
#     Copy this file to /etc/fail2ban/jail.d/sshd-custom.conf on the Pi:
#
#       sudo cp fail2ban-ssh.conf /etc/fail2ban/jail.d/sshd-custom.conf
#       sudo systemctl restart fail2ban
#
# [*] Why jail.d/ instead of editing jail.conf?
#     The jail.d/ directory holds drop-in overrides. This approach keeps
#     our custom policy separate from the upstream default configuration,
#     making it resilient to package upgrades that may overwrite jail.conf.
#
# [*] Monitoring:
#     Check jail status:   sudo fail2ban-client status sshd
#     View banned IPs:     sudo fail2ban-client get sshd banned
#     Unban an IP:         sudo fail2ban-client set sshd unbanip <IP>
#     View fail2ban log:   journalctl -u fail2ban --no-pager -n 50
#
# ==========================================================================

[sshd]

# -- Enable this jail
# [*] When set to 'true', fail2ban actively monitors the SSH auth log
#     and enforces the ban policy defined below.
enabled = true

# -- Target port
# [*] The SSH service port to protect. 'ssh' resolves to port 22.
#     If SSH is configured on a non-standard port, replace 'ssh' with
#     the numeric port value (e.g., port = 2222).
port = ssh

# -- Log filter
# [*] Specifies which fail2ban filter to use for parsing log entries.
#     The 'sshd' filter ships with fail2ban and matches OpenSSH
#     authentication failure patterns in /var/log/auth.log or journald.
filter = sshd

# -- Maximum retry attempts before ban
# [*] After 3 failed login attempts from a single IP within the
#     'findtime' window, that IP is banned. Keeping this low (3)
#     limits the attacker's ability to guess credentials while still
#     allowing for occasional legitimate typos.
maxretry = 3

# -- Ban duration in seconds
# [*] 3600 seconds = 1 hour. The offending IP is blocked from
#     reaching the SSH port for this duration. After the ban expires,
#     the IP is automatically unbanned. Repeat offenders will be
#     re-banned on the next set of failures.
bantime = 3600

# -- Failure detection window in seconds
# [*] 600 seconds = 10 minutes. fail2ban counts authentication
#     failures within this rolling window. If 'maxretry' failures
#     occur within 10 minutes, the ban is triggered. This prevents
#     slow brute-force attacks that space out attempts.
findtime = 600
